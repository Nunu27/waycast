name: Publish Package to npmjs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Format & Lint Check
        run: bunx biome check .

      - name: TypeScript Compile Check
        run: bun run typecheck

      - name: Run Tests
        run: bun test

      - name: Build Package
        run: bun run build

      - name: Publish to NPM
        run: bun publish --ignore-scripts
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
